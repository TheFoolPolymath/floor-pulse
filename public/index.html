<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Floor Pulse</title>
<meta name="theme-color" content="#0D1217">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
/* Layout: sticky control bar + tab strip, then a stack of cards that open into 2-4 columns on wide screens.
   Palette: cool slate neutrals, amber accent for live/active state, five team hues, green/red reserved for up/down. */
:root{
  --bg:#F1F3F5;--surface:#FFFFFF;--surface2:#F5F7F9;--line:#DCE2E8;--fg:#13202C;--muted:#5C6B79;
  --accent:#A86300;--accent-bg:#FFF0D2;--up:#17814A;--down:#C4382F;
  --c1:#2F6FD6;--c2:#B87408;--c3:#7E55CC;--c4:#CC3F7C;--c5:#0F8F8D;
  --font:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;--mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1217;--surface:#141B22;--surface2:#1A232C;--line:#27323D;--fg:#E7ECF1;--muted:#8D9BA9;
  --accent:#F2B13A;--accent-bg:#3A2D12;--up:#3FC17C;--down:#EE6B61;
  --c1:#5C9CF5;--c2:#EDAA3E;--c3:#A98BF0;--c4:#F07BA8;--c5:#38C7C3;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1217;--surface:#141B22;--surface2:#1A232C;--line:#27323D;--fg:#E7ECF1;--muted:#8D9BA9;
  --accent:#F2B13A;--accent-bg:#3A2D12;--up:#3FC17C;--down:#EE6B61;
  --c1:#5C9CF5;--c2:#EDAA3E;--c3:#A98BF0;--c4:#F07BA8;--c5:#38C7C3;color-scheme:dark}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font:14px/1.45 var(--font);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1240px;margin:0 auto}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-top:12px;border-bottom:1px solid var(--line)}
.bar1{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand b{font-size:18px;font-weight:800;letter-spacing:-.01em}
.brand small{display:block;color:var(--muted);font-size:12px}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;color:var(--muted);padding:6px 11px;font:600 12px var(--font);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent-bg);color:var(--accent)}
select,input{font:500 13px var(--font);background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:6px 9px;min-width:0}
input:disabled,select:disabled{opacity:.5}
button{font-family:var(--font)}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:6px 11px;font:600 12px var(--font);cursor:pointer}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.btn.dng{color:var(--down);border-color:var(--down)}
.btn:disabled{opacity:.5;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.live{display:inline-flex;align-items:center;gap:7px;font:500 12px var(--mono);color:var(--muted)}
.live i{width:8px;height:8px;border-radius:50%;background:var(--up);animation:pl 1.6s infinite}
.live.off i{background:var(--muted);animation:none}
@keyframes pl{50%{opacity:.3}}
@media (prefers-reduced-motion:reduce){.live i{animation:none}}
.tabs{display:flex;gap:2px;overflow-x:auto;margin-top:10px;scrollbar-width:none}
.tabs button{border:0;background:transparent;color:var(--muted);padding:9px 13px;font:600 13px var(--font);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
main{padding-top:16px;display:grid;gap:12px}
h2{font-size:20px;font-weight:800;margin:0;letter-spacing:-.01em}
h3{font-size:12px;font-weight:700;margin:0 0 10px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.head{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between}
.head p{margin:2px 0 0;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.grid{display:grid;gap:12px}
.g4{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,430px),1fr))}
.kpi .v{font:700 28px/1.1 var(--mono);font-variant-numeric:tabular-nums;margin:2px 0 6px}
.kpi .s{color:var(--muted);font-size:12px}
.kpi.sm .v{font-size:20px}
.n{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.bar{height:8px;background:var(--surface2);border-radius:4px;position:relative;overflow:hidden;border:1px solid var(--line)}
.bar>i{display:block;height:100%;background:var(--accent)}
.bar>.mk{position:absolute;top:0;bottom:0;width:2px;background:var(--fg);opacity:.7}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font:700 11px var(--font);color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding:6px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th.s{cursor:pointer}th.s:hover{color:var(--fg)}
td{padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
tr.clk{cursor:pointer}tr.clk:hover td{background:var(--surface2)}
tr.sel td{background:var(--accent-bg)}
tr.tot td{font-weight:700;border-top:2px solid var(--line);background:var(--surface2)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font:600 11px var(--font);background:var(--surface2);border:1px solid var(--line)}
.pill.p{color:var(--up);border-color:var(--up)}.pill.a{color:var(--down);border-color:var(--down)}.pill.l{color:var(--accent);border-color:var(--accent)}
.dl{font:600 12px var(--mono)}.up{color:var(--up)}.dn{color:var(--down)}
.spark{vertical-align:middle}
.rrow{display:grid;grid-template-columns:22px minmax(90px,150px) 1fr auto;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.rrow:last-child{border-bottom:0}
.rrow .meta{font-size:12px;color:var(--muted)}
.rrow.off{opacity:.45}
.feed{display:grid;gap:0;max-height:300px;overflow-y:auto}
.feed div{padding:7px 0;border-bottom:1px solid var(--line);font-size:13px;display:flex;gap:10px}
.feed time{font:500 12px var(--mono);color:var(--muted);flex:none}
.dots{display:flex;flex-wrap:wrap;gap:4px;margin:8px 0}
.dots i{width:14px;height:14px;border-radius:3px;border:1px solid var(--line);background:var(--surface2)}
.dots i.on{background:var(--up);border-color:var(--up)}.dots i.lv{background:var(--accent);border-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:4px 9px;border-radius:6px;font:600 12px var(--font);border:1px solid var(--line);background:var(--surface2)}
.chip.p{border-color:var(--up);color:var(--up)}.chip.a{border-color:var(--down);color:var(--down)}.chip.l{border-color:var(--accent);color:var(--accent)}
.heat{display:grid;grid-template-columns:repeat(14,1fr);gap:3px;max-width:420px}
.heat i{aspect-ratio:1;border-radius:3px;background:var(--surface2);border:1px solid var(--line)}
.heat i.p{background:var(--up);border-color:var(--up)}.heat i.a{background:var(--down);border-color:var(--down)}.heat i.l{background:var(--accent);border-color:var(--accent)}
.cmp{display:grid;gap:8px}
.cmp .row{display:grid;grid-template-columns:minmax(110px,160px) 1fr 90px;gap:10px;align-items:center;font-size:13px}
svg text{font-family:var(--mono);font-size:10.5px;fill:var(--muted)}
svg .tag{font-weight:700}
.note{font-size:12px;color:var(--muted);margin:0}
.form{display:flex;flex-wrap:wrap;gap:8px;align-items:end}
.form label{display:grid;gap:3px;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.msg{color:var(--accent);font-weight:600;font-size:13px;margin:8px 0 0}
.lock{border:1px dashed var(--line);border-radius:8px;padding:8px 10px;font-size:12px;color:var(--muted)}
.login{max-width:420px;margin:8vh auto 0;text-align:center;display:grid;gap:12px;justify-items:center}
.login p{margin:0}
#gbtn{min-height:44px}
/* hover tips: anything with data-tip explains itself */
[data-tip]{cursor:help}
th[data-tip],h3[data-tip]{text-decoration:underline dotted var(--muted);text-underline-offset:4px}
tr.clk [data-tip],.btn[data-tip],select[data-tip],input[data-tip]{cursor:pointer}
#tip{position:fixed;z-index:50;max-width:min(320px,calc(100vw - 16px));background:var(--fg);color:var(--bg);padding:8px 10px;border-radius:8px;font:500 12px/1.4 var(--font);pointer-events:none;box-shadow:0 6px 24px rgba(0,0,0,.28);text-transform:none;letter-spacing:0;white-space:normal}
/* help page */
.help h3{margin-top:4px}
.help p,.help li{margin:0 0 6px;max-width:80ch}
.help ul,.help ol{margin:0 0 10px;padding-left:20px}
.help dl{display:grid;grid-template-columns:minmax(120px,190px) 1fr;gap:8px 14px;margin:0}
.help dt{font-weight:700}.help dd{margin:0;max-width:75ch}
@media (max-width:640px){.help dl{grid-template-columns:1fr}.help dd{margin-bottom:6px}}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;border:1px solid var(--line);vertical-align:-1px;margin-right:4px}
@media (max-width:560px){.rrow{grid-template-columns:20px 1fr auto}.rrow .bar{grid-column:1/-1}.kpi .v{font-size:24px}}
textarea{font:500 13px var(--font)}
.grp td{background:var(--surface2);font-weight:700;font-size:12px;color:var(--muted)}
.fgrid,.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px 14px}
.fgrid label{display:grid;gap:3px;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.fgrid label.wide{grid-column:1/-1}.fgrid input,.fgrid select{width:100%}
.kv div{display:grid;gap:1px;align-content:start}.kv small{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:700}.kv span{word-break:break-word}
.warn{border:1px solid var(--accent);background:var(--accent-bg);color:var(--accent);border-radius:8px;padding:8px 10px;font-size:12px;font-weight:600;margin-top:10px}
.stuck{color:var(--down);font-weight:700}
.pace{position:relative;min-width:90px}.pace s{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--fg);pointer-events:none}
.dn{color:var(--down)}.up{color:var(--up)}
/* ===== v4 shell: sidebar navigation, header, phone layout ===== */
body{padding:0!important;background:var(--bg)}
body::before{display:none}
body.nolog .side{display:none}
body.nolog .top{display:none}
body.nolog .main{margin-left:0!important}
.app{min-height:100vh}
.side{position:fixed;top:0;bottom:0;left:0;width:248px;z-index:30;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
.side-head{display:flex;align-items:center;gap:10px;padding:12px 10px 12px 14px;border-bottom:1px solid var(--line);min-height:64px}
.brand-t{flex:1;min-width:0}
.brand-t b{display:block;font-size:16px;font-weight:800}
.brand-t small{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#nav{overflow-y:auto;flex:1;padding:4px 8px 16px}
.ng{margin-bottom:4px}
.ng-h{width:100%;display:flex;align-items:center;gap:8px;border:0;background:transparent;color:var(--muted);font:700 11px var(--font);text-transform:uppercase;letter-spacing:.08em;padding:12px 8px 6px;cursor:pointer;text-align:left;min-height:40px}
.ng-h:hover{color:var(--fg)}
.ng-h .chev{margin-left:auto;font-size:13px}
.ng-items{display:grid;gap:2px}
.nv{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;color:var(--fg);font:600 14px var(--font);padding:9px 10px 9px 12px;border-radius:8px;cursor:pointer;text-align:left;min-height:40px;border-left:3px solid transparent}
.nv:hover{background:var(--surface2)}
.nv.on{background:var(--accent-bg);color:var(--accent);border-left-color:var(--accent)}
.ic{flex:none;display:inline-grid;place-items:center;width:32px;height:32px;border-radius:9px;background:var(--surface2);border:1px solid var(--line);color:var(--muted)}
.ic svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.nv.on .ic{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.ibtn{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;min-width:36px;height:36px;padding:0 8px;cursor:pointer;font:700 16px var(--font);flex:none}
.menu{display:none}
.scrim{display:none}
.main{min-width:0;margin-left:248px;padding:0 24px 48px}
.top{position:sticky;top:0;z-index:20;background:var(--bg);display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 24px;margin:0 -24px;border-bottom:1px solid var(--line)}
.top .ttl{flex:1 1 200px;min-width:0;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.top h1{margin:0;font-size:18px;font-weight:800;letter-spacing:-.01em}
#bar1{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
#view{max-width:1240px}
.sum{border-left:5px solid var(--line)}
.sum.t-good{border-left-color:var(--up)}.sum.t-warn{border-left-color:var(--accent)}.sum.t-bad{border-left-color:var(--down)}
.sum-top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start}
.sum-verdict{font:800 22px var(--font)}
.sum-big{text-align:right}
.sum-big span{font:700 40px/1 var(--mono)}
.sum-big small{display:block;color:var(--muted);font-size:12px}
.sum-l{margin:12px 0 0;padding-left:18px;display:grid;gap:6px;font-size:15px}
@media (min-width:720px){
 .app.rail .side{width:72px}
 .app.rail .main{margin-left:72px}
 .app.rail .side-head{flex-direction:column;justify-content:center;gap:8px;padding:10px 0}
 .app.rail .brand-t,.app.rail .lbl,.app.rail .ng-h{display:none}
 .app.rail .ng-items{display:grid!important;justify-items:center}
 .app.rail .ng{margin-bottom:4px;border-top:1px solid var(--line);padding-top:4px}
 .app.rail .nv{width:auto;justify-content:center;padding:9px 6px;border-left-width:0}
 .app.rail .nv.on{border-left-width:0}
}
@media (max-width:719px){
 body{font-size:15px}
 .side{width:280px;transform:translateX(-105%);transition:transform .2s ease}
 .app.drawer .side{transform:none;box-shadow:0 0 40px rgba(0,0,0,.35)}
 .app.drawer .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:25}
 #sideToggle{display:none}
 .menu{display:inline-flex;align-items:center;justify-content:center;min-width:44px;height:44px}
 .main{margin-left:0;padding:0 16px 40px}
 .top{margin:0 -16px;padding:10px 16px;gap:8px}
 .top h1{font-size:17px}
 #bar1{gap:6px}
 #bar1 .who{display:none}
 #bar1{display:grid;grid-template-columns:1fr 1fr;width:100%;order:3}
 #bar1 .seg{grid-column:1/-1;display:flex}
 #bar1 .seg button{flex:1}
 #bar1 select{grid-column:1/-1;width:100%}
 #bar1 .btn{width:100%}
 .top{position:static;row-gap:8px}
 .top .live{font-size:11px}
 .btn,.ibtn,.nv{min-height:44px}
 .btn{padding:8px 12px;font-size:14px}
 .seg button{min-height:40px;padding:8px 12px;font-size:13px}
 input,select,textarea{max-width:100%;font-size:16px}
 .card{padding:14px}
 h2{font-size:20px}
 h3{font-size:13px}
 .kpi .v{font-size:26px}
 .m-hide{display:none!important}
 svg text{font-size:15px}
 table.rt{font-size:15px}
 table.rt thead{display:none}
 table.rt,table.rt tbody{display:block;width:100%}
 table.rt tr{display:block;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:4px 14px;margin:0 0 12px}
 table.rt tr.grp,table.rt tr.tot{background:var(--surface2)}
 table.rt td{display:grid;grid-template-columns:minmax(0,42%) minmax(0,1fr);gap:10px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line);white-space:normal;text-align:left;min-width:0}
 table.rt td:last-child{border-bottom:0}
 table.rt td.r{text-align:right}
 table.rt td::before{content:attr(data-l);font:700 11px var(--font);text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
 table.rt td.nl{display:block;padding:10px 0 8px;font-size:16px}
 table.rt td.nl::before{content:none}
 table.rt td:empty{display:none}
 table.rt td input,table.rt td select{width:100%}
 table.rt td .bar{margin-top:4px}
}
/* ===== v5 polish: modern desktop look, lean phone layout (these rules come last and win) ===== */
:root{--shadow:0 1px 2px rgba(16,24,40,.05),0 1px 1px rgba(16,24,40,.03);--shadow-pop:0 10px 28px rgba(16,24,40,.12)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--shadow:0 1px 2px rgba(0,0,0,.4);--shadow-pop:0 10px 28px rgba(0,0,0,.5)}}
:root[data-theme="dark"]{--shadow:0 1px 2px rgba(0,0,0,.4);--shadow-pop:0 10px 28px rgba(0,0,0,.5)}
button,select,input{transition:background .15s,border-color .15s,color .15s,box-shadow .15s}
.card{border-radius:12px;box-shadow:var(--shadow)}
main{gap:14px}
h2{font-size:21px;letter-spacing:-.02em}
.head p{font-size:13.5px;max-width:72ch}
th{background:var(--surface);padding:9px 12px}
td{padding:10px 12px}
tbody tr:hover td{background:var(--surface2)}
tr.sel td,tr.clk:hover td{background:var(--accent-bg)}
tr.tot td{background:var(--surface2)}
.tw{border-radius:10px}
.kpi .v{font-size:30px}
.pill{border-radius:999px;padding:2px 9px}
.seg{background:var(--surface2);padding:3px;border-radius:10px;border-color:var(--line)}
.seg button{border-radius:7px;padding:6px 12px;color:var(--muted)}
.seg button:hover{color:var(--fg)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--accent);box-shadow:0 1px 2px rgba(16,24,40,.12)}
.btn{border-radius:9px;box-shadow:var(--shadow)}
.btn:hover:not(:disabled){background:var(--surface2)}
.btn.pri{box-shadow:0 1px 2px rgba(0,0,0,.15)}
.btn.pri:hover:not(:disabled){background:var(--accent);filter:brightness(1.07)}
select,input{border-radius:9px}
.top{background:color-mix(in srgb,var(--bg) 90%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.top h1{font-size:19px}
.side{box-shadow:var(--shadow)}
.brand-t b{font-size:15px}
.ng-h{font-size:10.5px;letter-spacing:.1em;padding:14px 10px 6px}
.nv{border-left:0;border-radius:10px;font-size:14px;font-weight:600;padding:9px 10px;margin:0}
.nv:hover{background:var(--surface2)}
.nv.on{background:var(--accent-bg);color:var(--accent)}
.nv.on .ic{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.side-foot{display:none}
.side-note{margin:0;font:500 12px var(--mono);color:var(--muted)}

@media (max-width:719px){
  body{font-size:14px}
  .app{overflow-x:clip}
  #bar1,#stamp{display:none!important}
  /* drawer: hidden from touch and screen readers when closed */

}

<script src="config.js"></script>
<script>
'use strict';
/* ============ constants ============ */
const CFG=Object.assign({API_URL:'',GOOGLE_CLIENT_ID:'',DATA_URL:'data/mock.json',REFRESH_MIN:5,BRANCH:'Mumbai Branch'},window.FP_CONFIG||{});
const DEMO=!CFG.API_URL;
let PL=2,PC=250,CONN_BM=.40,DISB_BM=.30,START=600,END=1140,DAYS=180;
let TODAY=new Date(),HIST=7,LOG=[],META={},LOADED=null,TD={},ACCESS=[],ALLROWS=[],SESSION=null,TIMER=null;
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const dateOf=i=>{const d=new Date(TODAY);d.setDate(d.getDate()-i);return d};
const dl=d=>d.getDate()+' '+MON[d.getMonth()];
const fmt=n=>Math.round(n).toLocaleString('en-IN');
const inr=n=>'₹'+Math.round(n).toLocaleString('en-IN');
const inrC=n=>{n=Math.round(n);const a=Math.abs(n);return a>=1e7?'₹'+(n/1e7).toFixed(2)+' Cr':a>=1e5?'₹'+(n/1e5).toFixed(2)+' L':'₹'+n.toLocaleString('en-IN')};
const pc=(x,d=0)=>(x*100).toFixed(d)+'%';
const hms=sec=>{sec=Math.max(0,Math.round(sec));const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),x=sec%60;return h+'h:'+String(m).padStart(2,'0')+'m:'+String(x).padStart(2,'0')+'s'};
const hm=m=>hms(m*60);
const hhmm=m=>String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num=v=>{const n=Number(String(v==null?'':v).replace(/[₹,\s]/g,''));return isFinite(n)?n:0};
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const $=s=>document.querySelector(s);

/* ============ hover tips ============ */
/* Anything with a data-tip attribute explains itself on hover (mouse), focus (keyboard) or tap (phone). */
const COL={
 name:'The telecaller. Click a row to open their detail.',
 today:'Attendance status for today: Present, Absent, Leave, or Not marked (nobody has entered attendance yet).',
 score:'Efficiency score out of 100. 45% logins, 30% calls, 15% connect rate, 10% disbursals, each compared with the target for the time of day. Higher is better.',
 change:'Score change: the latest working days compared with the same number of days before them. ▲ green = improving, ▼ red = slipping.',
 d14:'Small line of the daily score over the last 14 days. Green line = ended higher than it started, red = lower.',
 cases:'Cases = customer files logged in (a “login”). This is the total in the chosen period.',
 pend:'Pending: cases logged in and still waiting for a bank/lender decision.',
 appr:'Approved: cases the lender has approved.',
 rej:'Rejected: cases the lender has declined.',
 disb:'Disbursed cases: how many cases actually had the money paid out.',
 amt:'Disbursed amount: total rupees paid out on disbursed cases.',
 calls:'Calls dialled in the period.',
 conn:'Connected: calls where the customer actually picked up and spoke.',
 connRate:'Connect rate = connected ÷ calls. Red means below the target set in Config.',
 talk:'Total talk time on connected calls.',
 avg:'Average length of one connected call.',
 perDay:'Calls per present day: total calls ÷ days this person was present.',
 att:'Attendance = days present ÷ working days with a record (Sundays and unmarked days excluded).',
 team:'The team.',leader:'The team leader.',
 rank:'Position: 1 is the best score in the period selected.',
 status:'Present, Absent or Leave for this date.',
 intime:'Time the person came in, as typed in the Attendance tab.',
 ni:'Not interested: connected calls where the customer said no.',
 apprRate:'Approval rate = approved ÷ cases logged in.',
 disbRate:'Disbursal rate = disbursed ÷ cases logged in. The benchmark is set in Config.',
 avgTicket:'Average amount per disbursed case = disbursed amount ÷ disbursed cases.',
 last:'The latest value in this series.',
 prev:'How much the latest value moved compared with the one before it.',
 proj:'A dashed straight-line guess three periods ahead, based on the recent slope. It is a guide, not a promise.',
 code:'Employee code, the unique ID used in the Google Sheet.',
 att2:'Attendance rate for the period shown.'
};
const T=t=>t?` data-tip="${esc(t)}"`:'';
const TC=k=>T(COL[k]);
const th=(k,l,r,x)=>`<th class="${r?'r':''}"${TC(k)}${x||''}>${l}</th>`;
const ths=(k,l,r,sk)=>`<th class="s ${r?'r':''}" data-act="sort" data-v="${sk}"${TC(k)}>${l}${S.sort.k===sk?(S.sort.d>0?' ▲':' ▼'):''}</th>`;

const tipEl=()=>$('#tip');let tipOn=null,tipTimer=null;
function placeTip(x,y,el){
  const t=tipEl(),w=t.offsetWidth,h=t.offsetHeight;
  if(x==null){const b=el.getBoundingClientRect();x=b.left+b.width/2-w/2;y=b.bottom+6}else{x+=12;y+=18}
  if(x+w>innerWidth-8)x=innerWidth-w-8;if(x<8)x=8;
  if(y+h>innerHeight-8)y=Math.max(8,(y-h-30));
  t.style.left=x+'px';t.style.top=y+'px';
}
function showTip(el,x,y){const txt=el.getAttribute('data-tip');if(!txt)return;const t=tipEl();t.textContent=txt;t.hidden=false;tipOn=el;placeTip(x,y,el)}
function hideTip(){const t=tipEl();if(t)t.hidden=true;tipOn=null;clearTimeout(tipTimer)}
const canHover=()=>matchMedia('(hover:hover)').matches;
document.addEventListener('mouseover',e=>{if(!canHover())return;const el=e.target.closest&&e.target.closest('[data-tip]');if(el){if(el!==tipOn)showTip(el,e.clientX,e.clientY)}else hideTip()});
document.addEventListener('mousemove',e=>{if(tipOn&&!tipEl().hidden&&canHover())placeTip(e.clientX,e.clientY,tipOn)});
document.addEventListener('mouseout',e=>{if(!e.relatedTarget)hideTip()});
document.addEventListener('focusin',e=>{const el=e.target.closest&&e.target.closest('[data-tip]');if(el)showTip(el)});
document.addEventListener('focusout',hideTip);
document.addEventListener('scroll',hideTip,true);
document.addEventListener('keydown',e=>{if(e.key==='Escape')hideTip()});
document.addEventListener('click',e=>{ /* phones: tap a number or box to read what it is, tap again elsewhere to close */
  if(canHover())return;const el=e.target.closest&&e.target.closest('[data-tip]');
  if(el&&!e.target.closest('[data-act],select,input,button')){showTip(el);clearTimeout(tipTimer);tipTimer=setTimeout(hideTip,5000)}else hideTip()},true);

/* ============ data: sheet rows -> app model ============ */
const TEAMS=[];let EMPS=[];
function istNow(t){
  const p={};new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Kolkata',hour12:false,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}).formatToParts(t).forEach(x=>{p[x.type]=x.value});
  return{y:+p.year,m:+p.month-1,d:+p.day,min:(+p.hour%24)*60+(+p.minute)};
}
const KEYS=['calls','conn','mins','logins','appr','rej','pend','disb','amt','ni'];
const zero=()=>({p:1,calls:0,conn:0,mins:0,logins:0,appr:0,rej:0,pend:0,disb:0,amt:0,ni:0,it:''});
const blank=(code,name,team)=>{const rec=Array.from({length:DAYS},()=>({p:-1}));rec[0]=zero();return{code,name,team,active:true,rec}};
const dayIdxOf=s=>Math.round((TODAY-new Date(+s.slice(0,4),+s.slice(5,7)-1,+s.slice(8,10)))/864e5);
function ingest(d){
  META=d.meta||{};
  DAYS=Math.max(14,Math.min(400,+META.history_days||180));
  const now=istNow(META.asof?new Date(META.asof):new Date());
  const prevDay=ymd(TODAY),prev=new Map(EMPS.map(e=>[e.code,(e.rec[0]&&e.rec[0].p===1)?e.rec[0].logins:0]));
  TODAY=new Date(now.y,now.m,now.d);S.min=now.min;
  const cfg={};(d.config||[]).forEach(r=>{cfg[r.key]=Number(r.value)});
  PL=cfg.per_head_logins||2;PC=cfg.per_head_calls||250;CONN_BM=cfg.connect_benchmark||.40;DISB_BM=cfg.disb_benchmark||.30;START=cfg.shift_start_min||600;END=cfg.shift_end_min||1140;
  const rows=d.employees||[];ALLROWS=rows;ACCESS=d.access||[];STUCK=cfg.stuck_days||3;
  TEAMS.length=0;
  let tl=d.teams;
  if(!tl){const seen={};tl=[];rows.forEach(r=>{if(!r.team_id||seen[r.team_id])return;seen[r.team_id]=1;const t=rows.find(x=>x.role==='TL'&&String(x.team_id)===String(r.team_id));tl.push({team_id:String(r.team_id),team_name:r.team_name||r.team_id,leader:t?t.name:'',size:rows.filter(x=>x.role==='TELECALLER'&&x.status!=='LEFT'&&String(x.team_id)===String(r.team_id)).length})})}
  const ids=tl.map(t=>String(t.team_id));
  tl.forEach((t,i)=>TEAMS.push({id:String(t.team_id),n:t.team_name||t.team_id,l:t.leader||'',size:t.size||0,c:'var(--c'+(i%5+1)+')'}));
  const tIdx=id=>ids.indexOf(String(id));
  EMPS=rows.filter(r=>r.role==='TELECALLER'&&tIdx(r.team_id)>=0).map(r=>({code:String(r.emp_code),name:r.name,team:tIdx(r.team_id),active:r.status!=='LEFT',rec:Array.from({length:DAYS},()=>({p:-1}))}));
  const by={};EMPS.forEach(e=>{by[e.code]=e});
  HIST=1;
  const slot=row=>{const e=by[String(row.emp_code)];if(!e)return null;const i=dayIdxOf(String(row.date).slice(0,10));if(i<0||i>=DAYS)return null;if(i>HIST)HIST=i;return{e,i}};
  (d.attendance||[]).forEach(r=>{const s=slot(r);if(!s)return;const st=String(r.status).toUpperCase();const o=st==='P'?zero():{p:st==='L'?2:0};o.it=String(r.in_time||'');s.e.rec[s.i]=o});
  (d.kpi||[]).forEach(r=>{const s=slot(r);if(!s)return;let o=s.e.rec[s.i];if(o.p===0||o.p===2)return;if(o.p===-1)o=s.e.rec[s.i]=zero();
    o.logins=num(r.logins);o.appr=num(r.approved);o.rej=num(r.rejected);o.pend=num(r.pending);o.disb=num(r.disbursed);o.amt=num(r.disbursed_amount);o.ni=num(r.not_interested)});
  (d.calls||[]).forEach(r=>{const s=slot(r);if(!s)return;let o=s.e.rec[s.i];if(o.p===0||o.p===2)return;if(o.p===-1)o=s.e.rec[s.i]=zero();
    o.calls=num(r.calls);o.conn=num(r.connected);o.mins=num(r.talk_seconds)/60});
  TD={};
  (d.team_daily||[]).forEach(r=>{const ti=tIdx(r.team_id);if(ti<0)return;const i=dayIdxOf(String(r.date).slice(0,10));if(i<0||i>=DAYS)return;if(i>HIST)HIST=i;
    (TD[ti]=TD[ti]||[])[i]={pres:num(r.present),abs:num(r.absent),lv:num(r.leave),calls:num(r.calls),conn:num(r.connected),mins:num(r.talk_seconds)/60,logins:num(r.logins),appr:num(r.approved),rej:num(r.rejected),pend:num(r.pending),disb:num(r.disbursed),amt:num(r.disbursed_amount),ni:0}});
  LOG=(d.efficiency_log||[]).map(r=>{const m=String(r.timestamp).match(/(\d{4}-\d{2}-\d{2})\D+(\d{2}):(\d{2})/);return m?{day:m[1],m:+m[2]*60+(+m[3]),scope:String(r.scope),score:+r.score}:null}).filter(Boolean).sort((a,b)=>a.m-b.m);
  SYNC=d.sync||null;SYNC_ON=!!d.sync_on;CASES=d.cases||[];CNOTES=d.case_notes||[];TARGETS=d.targets||[];REMARKS=d.remarks||[];DEVICES=d.devices||[];
  if(d.team_targets)TTARGETS=d.team_targets;else recomputeTT();
  if(DEMO&&d.directory)DIR=DIR.length?DIR:d.directory;
  S.locked=false;
  if(d.role==='TL'){S.role='tl';S.tl=Math.max(0,tIdx(d.team_id));S.locked=true}
  else if(d.role==='ADMIN'){S.role='admin';S.locked=true}
  if(S.tl>=TEAMS.length)S.tl=0;
  S.day=Math.max(0,Math.min(S.day,maxRange()-1));
  if(prev.size&&prevDay===ymd(TODAY)){
    const ev=[];EMPS.forEach(e=>{const r=e.rec[0],b=prev.get(e.code)||0;if(r.p===1&&r.logins>b)ev.push({m:S.min,code:e.code,d:r.logins-b,tot:agg(teamEmps(e.team),0,0).logins})});
    S.feed=[...ev,...S.feed].slice(0,80);
  }else S.feed=[];
  LOADED=new Date();
}

/* ============ sign-in and loading ============ */
const readSession=()=>{try{const s=JSON.parse(localStorage.getItem('fp-session')||'null');return s&&s.token&&s.user?s:null}catch(x){return null}};
const saveSession=s=>{try{localStorage.setItem('fp-session',JSON.stringify(s))}catch(x){}};
async function api(action,body){
  const res=await fetch(CFG.API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({action,token:SESSION&&SESSION.token,device:deviceInfo()},body||{}))});
  if(!res.ok)throw new Error('HTTP '+res.status);
  return res.json();
}
function signOut(msg){
  clearInterval(TIMER);TIMER=null;SESSION=null;
  try{localStorage.removeItem('fp-session');localStorage.removeItem('fp-cache')}catch(x){}
  try{window.google&&google.accounts.id.disableAutoSelect()}catch(x){}
  EMPS=[];TEAMS.length=0;TD={};ACCESS=[];ALLROWS=[];LOG=[];CASES=[];CNOTES=[];TARGETS=[];TTARGETS=[];REMARKS=[];DEVICES=[];DIR=[];DIRLOADED=false;
  Object.assign(S,{sel:null,tab:'live',day:0,feed:[],msg:'',confirm:null,err:''});
  showLogin(msg);
}
function loadGsi(){
  return new Promise((ok,bad)=>{
    if(window.google&&google.accounts&&google.accounts.id)return ok();
    const s=document.createElement('script');s.src='https://accounts.google.com/gsi/client';s.async=true;
    s.onload=()=>ok();s.onerror=()=>bad(new Error('Could not load Google sign-in. Check your internet connection and try again.'));
    document.head.appendChild(s);
  });
}
async function showLogin(msg,busy){
  hideTip();
  $('#bar1').innerHTML='';$('#nav').innerHTML='';$('#sideAct').innerHTML='';$('#pagetitle').textContent='';$('#stamp').textContent='';document.body.classList.add('nolog');
  $('#view').innerHTML=`<div class="card login"><svg width="44" height="44" viewBox="0 0 30 30" aria-hidden="true"><rect width="30" height="30" rx="7" style="fill:var(--accent)"/><path d="M4 16h5l3-8 5 14 3-6h6" fill="none" style="stroke:var(--bg)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
   <h2>Floor Pulse</h2><p class="muted">${busy?'Signing you in…':'Sign in with your Google account'}</p>
   <div id="gbtn" ${busy?'hidden':''}></div>
   ${msg?`<p class="msg" role="alert">${esc(msg)}</p>`:''}
   <p class="note">Only Google accounts added by your admin can get in.</p></div>`;
  if(busy)return;
  if(!CFG.GOOGLE_CLIENT_ID){$('#gbtn').outerHTML='<p class="msg">GOOGLE_CLIENT_ID is empty in config.js.</p>';return}
  try{
    await loadGsi();
    google.accounts.id.initialize({client_id:CFG.GOOGLE_CLIENT_ID,callback:onCredential});
    const el=$('#gbtn');if(el)google.accounts.id.renderButton(el,{theme:'outline',size:'large',text:'signin_with',shape:'rectangular',width:280});
  }catch(err){const el=$('#gbtn');if(el)el.outerHTML='<p class="msg">'+esc(err.message)+'</p>'}
}
async function onCredential(resp){
  showLogin('',true);
  try{
    const r=await api('login',{id_token:resp.credential});
    if(r.error){showLogin(r.message||'Sign-in failed.');return}
    try{localStorage.removeItem('fp-cache')}catch(x){}
    SESSION={token:r.token,user:r.user};saveSession(SESSION);
    await boot();
  }catch(err){showLogin('Could not reach the server. Check your internet and try again.')}
}
/* returns true (loaded), false (failed, message in S.err) or 'auth' (signed out) */
async function load(){
  let d;
  try{

   <div class="card kpi" tabindex="0"${T('Telecallers marked Present today out of everyone on the team. People on leave or absent are not counted in today’s targets.')}><h3>Present today</h3><div class="v">${a.pres}<span class="muted" style="font-size:16px"> / ${n}</span></div><div class="s">${pc(n?a.pres/n:0)} attendance · ${n-a.pres} absent, on leave or not marked</div></div>
   <div class="card kpi" tabindex="0"${T('Cases (customer files) logged in so far today, out of today’s full-day target of '+PL+' per present person. The thin black line on the bar is where the day should be by now.')}><h3>Cases logged in</h3><div class="v">${a.logins}<span class="muted" style="font-size:16px"> / ${tL}</span></div><div class="bar"><i style="width:${Math.min(100,tL?a.logins/tL*100:0).toFixed(1)}%"></i><span class="mk" style="left:${(f*100).toFixed(1)}%"></span></div><div class="s" style="margin-top:6px">Day target ${tL} · on pace for ${pace}</div></div>
   <div class="card kpi" tabindex="0"${T('Calls dialled so far today out of the full-day target of '+PC+' per present person. Black line = where you should be by this time.')}><h3>Calls</h3><div class="v">${fmt(a.calls)}<span class="muted" style="font-size:16px"> / ${fmt(tC)}</span></div><div class="bar"><i style="width:${Math.min(100,tC?a.calls/tC*100:0).toFixed(1)}%"></i><span class="mk" style="left:${(f*100).toFixed(1)}%"></span></div><div class="s" style="margin-top:6px">Connect rate ${a.calls?pc(a.conn/a.calls,1):'–'}</div></div>
   <div class="card kpi" tabindex="0"${T('Money paid out today: the number of disbursed cases and the total rupee amount ('+inr(a.amt)+').')}><h3>Disbursed today</h3><div class="v">${inrC(a.amt)}</div><div class="s">${a.disb} case${a.disb===1?'':'s'} · ${a.pend} pending · ${a.appr} approved · ${a.rej} rejected</div></div>
   <div class="card kpi" tabindex="0"${TC('score')}><h3>Efficiency score</h3><div class="v">${sc.t.toFixed(1)}</div><div class="s">${delta(d==null?null:d)} vs 10 min ago</div></div>
   ${pos}
  </div>
  <div class="grid g2">
   <div class="card"><h3${T('The efficiency score recorded every 10 minutes today by the Google Sheet timer.')}>Efficiency, every 10 minutes</h3>${labels.length>1?lineChart({labels,series:[{name:'Score',color:'var(--c2)',vals,area:true}],ymin:0,ymax:100,h:230,aria:'Efficiency score through the day'}):'<p class="note">A point is added here every 10 minutes by the Efficiency_Log tab.</p>'}
     <div class="cmp" style="margin-top:10px">${comp.map(c=>`<div class="row"${T(c[2])}><span class="muted">${c[0]}</span>${bar(c[1],1.2,c[1]>=1?'var(--up)':c[1]>=.8?'var(--accent)':'var(--down)')}<span class="n">${pc(c[1])}</span></div>`).join('')}</div></div>

     <p class="note">Each square is one person: <span class="sw" style="background:var(--up)"></span>present, <span class="sw" style="background:var(--accent)"></span>leave, empty = absent or not marked. Hover a square for the name.</p>

/* ---- Day view: pick any date ---- */
function vDay(){
  const i=S.day,d=dateOf(i),f=fOf(i),A=S.role==='admin';
  const E=scopeAll().filter(e=>rec(e,i).p>=0||e.active);
  const a=agg(E,i,i,f),sc=score(a);
  const minD=ymd(dateOf(maxRange()-1)),maxD=ymd(dateOf(0));
  const wd=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][d.getDay()];
  const noData=!a.days;
  const ctl=`<div class="form"><label${T('Pick any date to see exactly what happened on that day.')}>Date<input type="date" id="d-pick" value="${ymd(d)}" min="${minD}" max="${maxD}"></label>
    <button class="btn" data-act="dayprev"${T('Go to the previous working day (Sundays are skipped).')}>◀ Previous</button><button class="btn" data-act="daynext"${T('Go to the next working day (Sundays are skipped).')}${i===0?' disabled':''}>Next ▶</button><button class="btn" data-act="daytoday"${T('Jump back to today.')}${i===0?' disabled':''}>Today</button></div>`;
  const head=`<div class="head"><div><h2>Day view · ${wd}, ${d.getDate()} ${MON[d.getMonth()]} ${d.getFullYear()}</h2><p>${i===0?'Today so far (the day is not over, so targets are scaled to the time now).':'The full day, as recorded in the sheet.'} ${S.role==='tl'?'Your team only, plus totals for every team.':''}</p></div>${ctl}</div>${accessNote()}`;
  if(noData)return head+`<div class="card"><p>No attendance or numbers were recorded for this date.</p><p class="note">${d.getDay()===0?'It is a Sunday, so nothing is expected.':'It may be a holiday, or the sheet has no rows for it yet. Try another date.'}</p></div>`;
  const n=E.length;
  const cards=`<div class="grid g4">
   <div class="card kpi" tabindex="0"${T('How many were marked Present on this date, out of the people listed below.')}><h3>Present</h3><div class="v">${a.pres}<span class="muted" style="font-size:16px"> / ${n}</span></div><div class="s">${a.abs} absent · ${a.lv} on leave</div></div>
   <div class="card kpi" tabindex="0"${TC('cases')}><h3>Cases logged in</h3><div class="v">${a.logins}<span class="muted" style="font-size:16px"> / ${a.pres*PL}</span></div><div class="s">target ${a.pres*PL} (${PL} per person present)</div></div>
   <div class="card kpi" tabindex="0"${TC('calls')}><h3>Calls</h3><div class="v">${fmt(a.calls)}<span class="muted" style="font-size:16px"> / ${fmt(a.pres*PC)}</span></div><div class="s">connect rate ${a.calls?pc(a.conn/a.calls,1):'–'}</div></div>
   <div class="card kpi" tabindex="0"${T('Money paid out on this date: disbursed cases and total rupees.')}><h3>Disbursed</h3><div class="v">${inrC(a.amt)}</div><div class="s">${a.disb} case${a.disb===1?'':'s'}</div></div>
   <div class="card kpi" tabindex="0"${TC('score')}><h3>Efficiency score</h3><div class="v">${sc.t.toFixed(1)}</div><div class="s">for this ${A?'branch':'team'} on this day</div></div></div>${caseCards(a)}`;
  const rk=rankTeams(i,i,f);
  const teamTbl=(A||TEAMS.length>1)?`<div class="card"><h3${T(A?'Every team on this date.':'Every team on this date. For other teams you only see team totals, never their people.')}>${A?'Teams on this day':'All teams on this day'}</h3><div class="tw"><table><thead><tr>${th('rank','#')}${th('team','Team')}${th('leader','Leader')}${th('score','Score',1)}${th('cases','Cases',1)}${th('disb','Disbursed',1)}${th('amt','Amount',1)}${th('calls','Calls',1)}${th('connRate','Connect',1)}</tr></thead><tbody>${rk.filter(o=>o.s.days).map((o,k)=>`<tr class="${!A&&o.ti===S.tl?'sel':''}"><td class="n">${k+1}</td><td>${teamDot(o.ti)}<b>${esc(TEAMS[o.ti].n)}</b>${!A&&o.ti===S.tl?' <span class="muted">(you)</span>':''}</td><td>${esc(TEAMS[o.ti].l)}</td><td class="r n"><b>${o.sc.t.toFixed(1)}</b></td><td class="r n">${o.s.logins}</td><td class="r n">${o.s.disb}</td><td class="r n">${inr(o.s.amt)}</td><td class="r n">${fmt(o.s.calls)}</td><td class="r n">${o.s.calls?pc(o.s.conn/o.s.calls,1):'–'}</td></tr>`).join('')}</tbody></table></div></div>`:'';
  const rows=E.map(e=>{const r=rec(e,i),s=agg([e],i,i,f);return{e,r,s,t:r.p===1?score(s).t:null}}).sort((x,y)=>(y.t==null?-1:y.t)-(x.t==null?-1:x.t)||x.e.name.localeCompare(y.e.name));
  const tot=a;
  const ppl=`<div class="card"><h3${T('Every telecaller on this date. Sorted by efficiency score; people who were not present are at the bottom.')}>Telecallers on this day</h3><div class="tw"><table><thead><tr>${th('name','Telecaller')}${th('status','Status')}${th('intime','In')}${th('score','Score',1)}${th('calls','Calls',1)}${th('conn','Connected',1)}${th('connRate','Connect',1)}${th('cases','Cases',1)}${th('pend','Pending',1)}${th('appr','Approved',1)}${th('rej','Rejected',1)}${th('disb','Disbursed',1)}${th('amt','Amount',1)}</tr></thead><tbody>${rows.map(o=>`<tr${o.e.active?'':' class="muted"'}><td>${teamDot(o.e.team)}<b>${esc(o.e.name)}</b>${o.e.active?'':' <span class="muted">(left)</span>'} <span class="muted n">${o.e.code}</span></td><td>${statusPill(o.r.p)}</td><td class="n">${esc(o.r.it||'–')}</td><td class="r n">${o.t==null?'–':'<b>'+o.t.toFixed(1)+'</b>'}</td><td class="r n">${o.r.p===1?fmt(o.s.calls):'–'}</td><td class="r n">${o.r.p===1?fmt(o.s.conn):'–'}</td><td class="r n ${o.r.p===1&&o.s.calls&&o.s.conn/o.s.calls<CONN_BM?'dn':''}">${o.r.p===1&&o.s.calls?pc(o.s.conn/o.s.calls,1):'–'}</td><td class="r n">${o.r.p===1?o.s.logins:'–'}</td><td class="r n">${o.r.p===1?o.s.pend:'–'}</td><td class="r n">${o.r.p===1?o.s.appr:'–'}</td><td class="r n">${o.r.p===1?o.s.rej:'–'}</td><td class="r n">${o.r.p===1?o.s.disb:'–'}</td><td class="r n">${o.r.p===1?inr(o.s.amt):'–'}</td></tr>`).join('')}
   <tr class="tot"><td>Total</td><td></td><td></td><td class="r n">${sc.t.toFixed(1)}</td><td class="r n">${fmt(tot.calls)}</td><td class="r n">${fmt(tot.conn)}</td><td class="r n">${tot.calls?pc(tot.conn/tot.calls,1):'–'}</td><td class="r n">${tot.logins}</td><td class="r n">${tot.pend}</td><td class="r n">${tot.appr}</td><td class="r n">${tot.rej}</td><td class="r n">${tot.disb}</td><td class="r n">${inr(tot.amt)}</td></tr></tbody></table></div></div>`;
  return head+cards+teamTbl+ppl;
}

function vTeams(){
  const rows=rankTeams(0,S.range-1);const mx=Math.max(1,...rows.map(r=>r.s.logins));
  const bs=buckets(H(Math.min(S.range,30)),'day'),labels=bs.map(b=>dl(dateOf(b.from)));
  const series=TEAMS.map((t,i)=>({name:t.n,color:t.c,vals:bs.map(b=>metricVal(i,b,'eff'))}));

}

/* ---- Team leaders: how every team is doing, totals only ---- */
function vRank(){
  const r=S.range,rows=rankTeams(0,r-1),me=rows.findIndex(o=>o.ti===S.tl),lead=rows[0];
  const bs=buckets(H(Math.min(r,30)),'day'),labels=bs.map(b=>dl(dateOf(b.from)));
  const series=TEAMS.map((t,i)=>({name:t.n,color:t.c,bold:i===S.tl,vals:bs.map(b=>metricVal(i,b,'eff'))}));

   <p class="note" style="margin-top:8px">You see team totals only. Other teams’ people, names and individual numbers are private to their own leaders.</p></div>
  <div class="card"><h3>Team efficiency per working day</h3>${lineChart({labels,series,ymin:0,ymax:100,h:260,aria:'Team efficiency per day for every team'})}<p class="note">Your team is the thicker line.</p></div>`;

function personStats(e,r){
  const s=agg([e],0,r-1),sc=score(s),W=winW(r);
  const A=score(agg([e],1,W,1)).t,B=score(agg([e],W+1,2*W,1)).t;
  const sp=[];for(let i=14;i>=1;i--){const x=agg([e],i,i,1);sp.push(x.tL?score(x).t:null)}
  return{e,s,sc,dl:B?(A-B)/B*100:null,sp,att:s.days?s.pres/s.days:0,p:today(e).p};
}
function empDetail(e){
  const o=personStats(e,S.range),c=o.sc;
  const comps=[['Login volume',c.rL,'Cases logged in ÷ target for the days present.'],['Call volume',c.rC,'Calls made ÷ call target for the days present.'],['Connect rate',c.rN,'Their connect rate ÷ the benchmark.'],['Disbursal',c.rD,'Their disbursed-of-logins rate ÷ the benchmark.']];
  const hi=[...comps].sort((a,b)=>b[1]-a[1])[0],lo=[...comps].sort((a,b)=>a[1]-b[1])[0];
  const cells=[];for(let i=27;i>=0;i--){const r=e.rec[i];cells.push([!r||r.p<0?'':r.p===1?'p':r.p===2?'l':'a',dl(dateOf(i))+': '+(!r||r.p<0?'no record (Sunday or not entered)':r.p===1?'Present':r.p===2?'On leave':'Absent')])}
  const bs=buckets(H(Math.min(S.range,60)),'day'),labels=bs.map(b=>dl(dateOf(b.from))),vals=bs.map(b=>metricVal([e],b,'eff'));
  return`<div class="card"><div class="head"><div><h2 style="font-size:17px">${teamDot(e.team)}${esc(e.name)} <span class="muted n" style="font-size:12px">${e.code}</span></h2><p>${esc(TEAMS[e.team].n)}'s team · score ${c.t.toFixed(1)} over ${span(S.range)}</p></div><button class="btn" data-act="close">Close</button></div>
  <h3 style="margin-top:12px">Cases and stages, ${span(S.range)}</h3>${caseCards(o.s)}
  <div class="grid g2" style="margin-top:12px"><div><h3>Strong and lacking</h3>
   <div class="cmp">${comps.map(x=>`<div class="row"${T(x[2]+' 100% = on target.')}><span class="muted">${x[0]}</span>${bar(x[1],1.2,x[1]>=1?'var(--up)':x[1]>=.8?'var(--accent)':'var(--down)')}<span class="n">${pc(x[1])}</span></div>`).join('')}</div>

function trendSeries(){
  const T0=S.trend,r=H(Math.min(S.range<30?30:S.range,maxRange())),bs=buckets(r,T0.gran),E=scope();
  let list=[];
  if(T0.level==='branch'&&S.role==='admin')list=[{name:'Branch',color:'var(--c1)',E:scopeAll()}];
  else if(T0.level==='team'&&S.role==='admin')list=TEAMS.map((t,i)=>({name:t.n,color:t.c,E:i}));
  else if(T0.level==='team')list=[{name:TEAMS[S.tl].n,color:TEAMS[S.tl].c,E:scopeAll()}];
  else{
    const cols=['var(--c1)','var(--c2)','var(--c3)','var(--c4)','var(--c5)','var(--muted)'];
    list=E.map(e=>{const v=bs.map(b=>metricVal([e],b,T0.metric)).filter(x=>x!=null);return{name:e.name.split(' ')[0],E:[e],avg:v.length?v.reduce((a,b)=>a+b,0)/v.length:0}})
      .sort((a,b)=>T0.dir==='top'?b.avg-a.avg:a.avg-b.avg).slice(0,6).map((o,i)=>({...o,color:cols[i]}));
  }
  const labels=bs.map(b=>blabel(b,T0.gran));
  list.forEach(s=>{let v=bs.map(b=>metricVal(s.E,b,T0.metric));
    if(T0.rebase){const f0=v.find(x=>x!=null);if(f0)v=v.map(x=>x==null?null:x/f0*100)}
    s.vals=v;s.proj=project(v)});
  return{labels,list};
}

const tEmp=(c,m)=>{const t=TARGETS.find(x=>x.scope==='EMP'&&x.id===c&&x.month===m);return t?t.amount:0};

function recomputeTT(){
  const months=[...new Set(TARGETS.map(t=>t.month))];TTARGETS=[];

}
function monthAmt(emps,m){let t=0;for(let i=0;i<DAYS;i++){if(ymd(dateOf(i)).slice(0,7)===m)t+=agg(emps,i,i,1).amt}return t}
function monthAmtTeam(ti,m){let t=0;for(let i=0;i<DAYS;i++){if(ymd(dateOf(i)).slice(0,7)===m)t+=teamAgg(ti,i,i,1).amt}return t}
function pace(m){const cm=curMonth();if(m<cm)return 1;if(m>cm)return 0;const y=+m.slice(0,4),mo=+m.slice(5,7)-1,dim=new Date(y,mo+1,0).getDate();let tot=0,el=0;
  for(let d=1;d<=dim;d++){if(new Date(y,mo,d).getDay()===0)continue;tot++;if(d<TODAY.getDate())el++;else if(d===TODAY.getDate())el+=F()}return tot?el/tot:0}
function progress(ach,tg,pz){if(!tg)return{pct:0,cls:'',lbl:'No target'};const p=ach/tg;if(p>=1)return{pct:p,cls:'p',lbl:'Target met'};if(p>=pz)return{pct:p,cls:'p',lbl:'Ahead'};if(p>=pz*.85)return{pct:p,cls:'l',lbl:'On track'};return{pct:p,cls:'a',lbl:'Behind'}}
const paceBar=(ach,tg,pz)=>`<div class="pace"${T('The bar is the target. The thin line is where the month should be by today ('+pc(pz)+').')}>${bar(ach,tg,ach/tg>=pz?'var(--up)':ach/tg>=pz*.85?'var(--accent)':'var(--down)')}<s style="left:${Math.min(100,pz*100).toFixed(1)}%"></s></div>`;

function vTargets(){
  const A=S.role==='admin',m=S.tmonth||curMonth(),cm=curMonth(),pz=pace(m),dr=S.tdraft[m]||{},dis=S.busy?' disabled':'';
  const E=scope().slice().sort((a,b)=>a.team-b.team||a.name.localeCompare(b.name));
  const rows=E.map(e=>{const tg=tEmp(e.code,m),ach=monthAmt([e],m);return{e,tg,ach,pr:progress(ach,tg,pz)}});
  const tr=TEAMS.map((t,i)=>{const tg=tTeam(t.id,m),ach=monthAmtTeam(i,m);return{t,i,tg,ach,set:tTeamSet(t.id,m),pr:progress(ach,tg,pz)}}).filter(o=>A||o.i===S.tl||o.tg);
  const mine=A?tr:tr.filter(o=>o.i===S.tl);
  const totT=mine.reduce((s,o)=>s+o.tg,0),totA=mine.reduce((s,o)=>s+o.ach,0),tp=progress(totA,totT,pz);
  const inp=(k,val,ph,lab)=>`<input class="tin" data-k="${k}" size="9" value="${esc(dr[k]!==undefined?dr[k]:val)}" placeholder="${ph}" aria-label="${esc(lab)}" autocomplete="off">`;

   <div class="card kpi sm"><h3>Disbursed so far</h3><div class="v">${inrC(totA)}</div><div class="s">${totT?pc(tp.pct)+' of target':'no target set'}</div></div>
   <div class="card kpi sm"><h3>Still to go</h3><div class="v">${totT?inrC(Math.max(0,totT-totA)):'—'}</div><div class="s">${m===cm?'Should be at '+pc(pz)+' by today':m<cm?'Month closed':'Not started'}</div></div></div>`;
  return`<div class="head"><div><h2>Targets</h2><p>${A?'Set a rupee target for every telecaller each month. A team’s target is the total of its members unless you type one for the team.':'Your team’s monthly targets and how each person is doing. Only your admin can change targets.'}</p></div>
   <div class="form"><button class="btn" data-act="x-tm" data-v="-1">◀</button><b style="min-width:92px;text-align:center">${monthLbl(m)}</b><button class="btn" data-act="x-tm" data-v="1"${m>=shiftMonth(cm,1)?' disabled':''}>▶</button></div></div>
  ${msgBox()}${kpi}
  <div class="card"><h3>Teams</h3><div class="tw"><table><thead><tr><th>Team</th><th class="r">Target</th><th class="r">Disbursed</th><th class="r">% of target</th><th>Progress</th><th class="r">Still to go</th><th>Status</th>${A?`<th${T('Optional. Leave blank to use the total of the members’ targets.')}>Team target (optional)</th>`:''}</tr></thead><tbody>
   ${tr.map(o=>`<tr><td>${teamDot(o.i)}<b>${esc(o.t.n)}</b> <span class="muted">${esc(o.t.l)}</span></td><td class="r n">${o.tg?inrC(o.tg):'—'}${o.tg&&TTARGETS.find(x=>x.team_id===o.t.id&&x.month===m).source==='set'?' <span class="pill"'+T('This team has its own target. It is not the total of its members.')+'>set</span>':''}</td><td class="r n">${inrC(o.ach)}</td><td class="r n">${o.tg?pc(o.pr.pct):'—'}</td><td style="min-width:120px">${o.tg?paceBar(o.ach,o.tg,pz):''}</td><td class="r n">${o.tg?inrC(Math.max(0,o.tg-o.ach)):''}</td><td><span class="pill ${o.pr.cls}">${o.pr.lbl}</span></td>${A?`<td>${inp('TEAM|'+o.t.id,amtTxt(o.set),'blank = total','Team target for '+o.t.n)}</td>`:''}</tr>`).join('')||'<tr><td colspan="8" class="muted">No teams yet.</td></tr>'}</tbody></table></div></div>
  <div class="card"><div class="head" style="margin:0 0 8px"><h3>${A?'Telecallers':'Your telecallers'}</h3>${A?`<div class="form"><button class="btn" data-act="x-tcopy"${dis}${T('Fill empty boxes with last month’s targets. Nothing is saved until you press Save targets.')}>Copy from ${monthLbl(shiftMonth(m,-1))}</button><button class="btn pri" data-act="x-tsave"${dis}>Save targets</button></div>`:''}</div>
   ${A?'<p class="note" style="margin:0 0 8px">Type the amount as 1600000, 16L, 16 lakh or 1.5cr. Empty clears the target. Press Save targets when done.</p>':''}
   <div class="tw"><table><thead><tr><th>Telecaller</th><th class="r">Target</th><th class="r">Disbursed</th><th class="r">% of target</th><th>Progress</th><th class="r">Still to go</th><th>Status</th></tr></thead><tbody>
   ${rows.map(o=>`<tr><td>${teamDot(o.e.team)}<b>${esc(o.e.name)}</b> <span class="muted n">${o.e.code}</span></td><td class="r n">${A?inp('EMP|'+o.e.code,amtTxt(o.tg),'e.g. 16L','Target for '+o.e.name):(o.tg?inrC(o.tg):'—')}</td><td class="r n">${inrC(o.ach)}</td><td class="r n">${o.tg?pc(o.pr.pct):'—'}</td><td style="min-width:120px">${o.tg?paceBar(o.ach,o.tg,pz):''}</td><td class="r n">${o.tg?inrC(Math.max(0,o.tg-o.ach)):''}</td><td><span class="pill ${o.pr.cls}">${o.pr.lbl}</span></td></tr>`).join('')}</tbody></table></div>
   <p class="note" style="margin-top:8px">Disbursed = rupees disbursed in ${monthLbl(m)} from the daily numbers. Ahead / On track / Behind compares each person with where the month should be today (${pc(pz)}).</p></div>`;
}
function saveTargets(){
  const m=S.tmonth||curMonth(),dr=S.tdraft[m]||{},items=[];let bad='';
  Object.keys(dr).forEach(k=>{const [sc,id]=k.split('|'),cur=sc==='EMP'?tEmp(id,m):tTeamSet(id,m),raw=String(dr[k]).trim(),v=raw===''?'':parseAmt(raw);
    if(v!==''&&(!isFinite(v)||v<0)){bad=bad||'Check the amount typed for '+(sc==='EMP'?nameOf(id):'team '+id)+'.';return}
    if((v===''?0:v)===cur)return;items.push({scope:sc,id,amount:v})});
  if(bad){S.msg=bad;render();return}
  if(!items.length){S.msg='Nothing has changed.';render();return}
  adminDo('target_set',{month:m,items},()=>{items.forEach(it=>applyTarget(it.scope,it.id,m,it.amount===''?0:it.amount));recomputeTT();delete S.tdraft[m];return'Targets saved for '+monthLbl(m)+'.'},async()=>{delete S.tdraft[m]});
}

/* ---- cases: customer, bank and stage, last 14 days ---- */
const caseDays=c=>Math.max(0,dayIdxOf(c.stage_date||c.date));
const isStuck=c=>!CLOSED.includes(c.stage)&&caseDays(c)>=STUCK;
const lastNote=id=>{const n=CNOTES.filter(x=>x.case_id===id);return n.length?n[n.length-1]:null};
const stagePill=s=>`<span class="pill ${STAGE_CLS[s]||''}">${esc(STAGE_LBL[s]||s)}</span>`;
const myCases=()=>{const cs=codeSet();return CASES.filter(c=>cs.has(c.emp_code))};
const askLine=c=>`${nameOf(c.emp_code)}: ${c.customer} (${c.bank}) has been ${(STAGE_LBL[c.stage]||c.stage).toLowerCase()} for ${caseDays(c)} days. Why has it not moved?`;
function caseRows(list,showEmp,cols){
  const dis=S.busy?' disabled':'',by={};list.forEach(c=>(by[c.date]=by[c.date]||[]).push(c));
  return Object.keys(by).sort().reverse().map(d=>`<tr class="grp"><td colspan="${cols}">${new Date(+d.slice(0,4),+d.slice(5,7)-1,+d.slice(8,10)).toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'short'})} · ${by[d].length} case${by[d].length>1?'s':''} · ${inrC(by[d].reduce((s,c)=>s+c.amount,0))}</td></tr>`+by[d].map(c=>{const n=lastNote(c.case_id),dd=caseDays(c);
   return`<tr>${showEmp?`<td>${esc(nameOf(c.emp_code))}</td>`:''}<td><b>${esc(c.customer)}</b></td><td>${esc(c.bank)}${(c.location||c.rm)?'<br><span class="muted">'+esc([c.location,c.rm?'RM '+c.rm:''].filter(Boolean).join(' · '))+'</span>':''}</td><td class="r n">${c.amount?inrC(c.amount):'—'}</td><td>${stagePill(c.stage)}${isStuck(c)?' <span class="stuck"'+T('Not moved for '+dd+' days. Ask why.')+'>Stuck '+dd+'d</span>':''}${!CLOSED.includes(c.stage)&&!isStuck(c)?'<br><span class="muted">'+(dd?dd+'d in this stage':'moved today')+'</span>':''}</td>
    <td style="max-width:240px">${c.reason?`<span><b>Bank:</b> ${esc(c.reason)}</span><br>`:''}${n?`<span>${esc(n.note)}</span><br><span class="muted">${esc(n.by)}, ${esc(String(n.date).slice(5,10))}</span>`:(c.reason?'':'<span class="muted">No note yet</span>')}</td>
    <td style="white-space:nowrap">${c.source==='BACKEND'?'':`<select id="cs-${esc(c.case_id)}" aria-label="Stage">${STAGES.map(s=>`<option value="${s}"${s===c.stage?' selected':''}>${STAGE_LBL[s]}</option>`).join('')}</select> `}<input id="cn-${esc(c.case_id)}" size="16" maxlength="300" placeholder="Reason / note" aria-label="Note" autocomplete="off"> <button class="btn" data-act="x-cmove" data-v="${esc(c.case_id)}"${dis}${T(c.source==='BACKEND'?'The stage comes from the backend sheet. You can add a note here.':'Save the new stage and/or the note.')}>${c.source==='BACKEND'?'Add note':'Update'}</button></td></tr>`}).join('')).join('')||`<tr><td colspan="${cols}" class="muted">No cases in the last 14 days.</td></tr>`;
}
const caseHead=(showEmp)=>`<tr>${showEmp?'<th>Telecaller</th>':''}<th>Customer</th><th>Bank</th><th class="r">Amount</th><th>Stage</th><th>Last note</th><th>Update</th></tr>`;
function followUps(list){
  const st=list.filter(isStuck).sort((a,b)=>caseDays(b)-caseDays(a));
  if(!st.length)return'<p class="muted" style="margin:0">Nothing is stuck. Every open case has moved in the last '+STUCK+' days.</p>';
  return`<ul style="margin:0 0 8px;padding-left:18px">${st.map(c=>`<li><b>${esc(nameOf(c.emp_code))}</b>: ${esc(c.customer)} (${esc(c.bank)}), ${esc((STAGE_LBL[c.stage]||c.stage).toLowerCase())} for <span class="stuck">${caseDays(c)} days</span>. Ask why it has not moved.</li>`).join('')}</ul><button class="btn" data-act="x-copyq">Copy this list to send on WhatsApp</button>`;
}

  ${S.addCase?`<div class="card"><h3>Add a case</h3><div class="form"><label>Telecaller<select id="ca-emp">${E.map(e=>`<option value="${e.code}"${S.cEmp===e.code?' selected':''}>${esc(e.name)}</option>`).join('')}</select></label>

   <p class="note" style="margin-top:8px">${DEMO?'Demo mode: changes last until you reload.':'Saved to the Cases tab of your Google Sheet. Your backend can also fill that tab.'}</p></div>`:''}
  <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr))"><div class="card kpi sm"><h3>Cases, 14 days</h3><div class="v">${all.length}</div><div class="s">${inrC(all.reduce((s,c)=>s+c.amount,0))} in value</div></div>
   <div class="card kpi sm"><h3>Stuck</h3><div class="v ${all.some(isStuck)?'dn':''}">${all.filter(isStuck).length}</div><div class="s">no movement for ${STUCK}+ days</div></div>
   ${['PENDING','QUERY','APPROVED','DISBURSED','REJECTED','NOT_INTERESTED'].map(s=>`<div class="card kpi sm"><h3>${STAGE_LBL[s]}</h3><div class="v">${cnt[s]}</div><div class="s">cases</div></div>`).join('')}</div>
  <div class="card"><h3>Ask these telecallers</h3>${followUps(all)}</div>

   <div class="tw"><table><thead>${caseHead(true)}</thead><tbody>${caseRows(list,true,7)}</tbody></table></div></div>`;
}

const dirComplete=r=>{const f=DF.filter(x=>String(r[x[0]]==null?'':r[x[0]]).trim()!=='').length+(r.join_date?1:0);return f/(DF.length+1)};
const normName=s=>String(s||'').toLowerCase().replace(/[^a-z]/g,'');
function checkDir(d){
  const ph=v=>{const x=String(v||'').replace(/\D/g,'').replace(/^(91)?0?(?=\d{10}$)/,'');return !v||/^[6-9]\d{9}$/.test(x)};
  if(!String(d.name||'').trim())return'Enter the name.';
  if(d.dob&&(d.dob>=ymd(TODAY)||d.dob<'1940-01-01'))return'Date of birth looks wrong.';
  if(!ph(d.mobile))return'Personal mobile must be a 10-digit Indian number.';
  if(!ph(d.emergency_phone))return'Emergency contact number must be a 10-digit Indian number.';
  if(d.email&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(d.email))return'Personal email does not look right.';
  if(d.pan&&!/^[A-Z]{5}[0-9]{4}[A-Z]$/.test(String(d.pan).toUpperCase().replace(/\s/g,'')))return'PAN must look like ABCDE1234F.';
  if(d.aadhaar&&!/^[2-9]\d{11}$/.test(String(d.aadhaar).replace(/\D/g,'')))return'Aadhaar must be 12 digits.';
  if(d.account_no&&!/^\d{6,20}$/.test(String(d.account_no).replace(/\D/g,'')))return'Account number must be 6 to 20 digits.';
  if(d.ifsc&&!/^[A-Z]{4}0[A-Z0-9]{6}$/.test(String(d.ifsc).toUpperCase().replace(/\s/g,'')))return'IFSC must look like HDFC0001234.';
  if(d.salary!==''&&d.salary!=null&&(!isFinite(num(d.salary))||num(d.salary)<0))return'Salary looks wrong.';
  if(d.exit_date&&d.join_date&&d.exit_date<d.join_date)return'Exit date cannot be before the joining date.';
  return'';
}

function normField(k,v){v=String(v==null?'':v).trim();

  if(k==='mobile'||k==='emergency_phone')return v.replace(/\D/g,'').replace(/^(91)?0?(?=\d{10}$)/,'');
  if(k==='email')return v.toLowerCase();
  if(k==='salary')return v===''?'':num(v);

    t.classList.add('rt');
    const heads=[...t.querySelectorAll('thead th')].map(h=>h.textContent.replace(/[▲▼]/g,'').replace(/\s+/g,' ').trim());
    const off=heads.map(h=>!h||PHONE_OFF.test(h)||DAY_COL.test(h));
    t.querySelectorAll('tbody tr').forEach(tr=>{
      let i=0;
      [...tr.children].forEach(td=>{
        if(td.colSpan>1){td.classList.add('nl');return}
        if(i===0)td.classList.add('nl');
        else if(heads[i])td.dataset.l=heads[i];
        if(off[i])td.classList.add('m-hide');
        i++;
      });
    });
  });
}

    else if(ti<0){S.msg='Add a team first.'}
    else if(!/^[A-Z0-9_-]{2,20}$/.test(code)){S.msg='Employee code can only use letters, numbers, - and _ (2 to 20 characters).'}
    else if(ALLROWS.some(e=>String(e.emp_code).toUpperCase()===code)){S.msg='The employee code '+code+' is already used.'}
    else{adminDo('staff_add',{emp_code:code,name,team_id:TEAMS[ti].id},()=>{EMPS.push(blank(code,name,ti));ALLROWS.push({emp_code:code,name,team_id:TEAMS[ti].id,role:'TELECALLER',status:'ACTIVE'});TEAMS[ti].size++;return name+' added to '+TEAMS[ti].n+"'s team."});return}
  }
  else if(a==='rm'){
    if(S.confirm===v){const e=EMPS.find(x=>x.code===v);S.confirm=null;
      if(e){adminDo('staff_remove',{emp_code:v},()=>{e.active=false;return e.name+' removed. Past numbers are kept.'});return}}
    else S.confirm=v;
  }
  else if(a==='rmno'){S.confirm=null}
  else if(a==='teamadd'){
    const tn=$('#tm-name').value.trim(),ln=$('#tm-lead').value.trim();
    if(!tn||!ln)S.msg='Enter both the team name and the leader’s name.';
    else if(TEAMS.some(t=>t.n.toLowerCase()===tn.toLowerCase()))S.msg='A team called '+tn+' already exists.';
    else{adminDo('team_add',{team_name:tn,leader_name:ln},()=>{const id='T'+(1+Math.max(0,...TEAMS.map(t=>+String(t.id).replace(/\D/g,'')||0)));TEAMS.push({id,n:tn,l:ln,size:0,c:'var(--c'+(TEAMS.length%5+1)+')'});ALLROWS.push({emp_code:'TL-'+id,name:ln,team_id:id,role:'TL',status:'ACTIVE'});return 'Team '+tn+' created. Now give '+ln+'’s Google account access.'});return}
  }
  else if(a==='accset'){
    const email=$('#a-email').value.trim().toLowerCase(),name=$('#a-name').value.trim(),role=$('#a-role').value,team=$('#a-team').value;
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))S.msg='That does not look like an email address.';
    else if(role==='TL'&&!team)S.msg='Add a team first, then choose it for this team leader.';
    else{adminDo('access_set',{email,name,role,team_id:role==='TL'?team:''},()=>{const ex=ACCESS.find(x=>x.email.toLowerCase()===email);const o={email,name,role,team_id:role==='TL'?team:'',status:'ACTIVE'};if(ex)Object.assign(ex,o);else ACCESS.push(o);return email+' can now sign in.'});return}
  }
  else if(a==='accrev'){
    if(S.confirm==='acc:'+v){S.confirm=null;adminDo('access_revoke',{email:v},()=>{ACCESS.filter(x=>x.email===v).forEach(x=>{x.status='REVOKED'});return v+' no longer has access.'});return}
    else S.confirm='acc:'+v;
  }
  render();
});
document.addEventListener('change',ev=>{
  const id=ev.target.id;if(!id)return;
  if(id==='a-role'){const t=$('#a-team');if(t)t.disabled=ev.target.value==='ADMIN';return}
  if(id==='tlteam'||id==='tlteam2'){S.tl=+ev.target.value;S.sel=null}
  else if(id==='d-pick'){const s=ev.target.value;if(!s)return;const i=dayIdxOf(s);S.day=Math.max(0,Math.min(i,maxRange()-1))}
  else if(id==='t-metric')S.trend.metric=ev.target.value;
  else if(id==='t-level')S.trend.level=ev.target.value;
  else if(id==='t-gran'){S.trend.gran=ev.target.value;if(S.trend.gran==='month'&&S.range<60)S.range=60}
  else if(id==='t-dir')S.trend.dir=ev.target.value;
  else if(id==='t-rebase')S.trend.rebase=ev.target.checked;
  else return;
  render();
});
async function boot(){
  $('#view').innerHTML='<div class="card"><p class="note">Loading data…</p></div>';
  if(!DEMO){SESSION=SESSION||readSession();if(!SESSION){showLogin();return}}
  const ok=await load();
  if(ok==='auth')return;
  if(!ok){$('#bar1').innerHTML='';$('#nav').innerHTML='';$('#sideAct').innerHTML='';$('#pagetitle').textContent='';$('#stamp').textContent='';document.body.classList.add('nolog');$('#view').innerHTML='<div class="card"><h3>Could not load data</h3><p>'+esc(S.err)+'</p><p class="note">'+(DEMO?'Check DATA_URL in config.js.':'Check your internet connection. If this keeps happening, tell your admin.')+'</p><p style="display:flex;gap:8px"><button class="btn pri" data-act="retry">Try again</button>'+(DEMO?'':'<button class="btn" data-act="signout">Sign out</button>')+'</p></div>';return}
  render();
  clearInterval(TIMER);if(!DEMO)TIMER=setInterval(refresh,CFG.REFRESH_MIN*60000);
}
document.addEventListener('click',ev=>{if(ev.target.closest('[data-act="retry"]'))boot()});
boot();
if('serviceWorker' in navigator)window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})});
</script>
